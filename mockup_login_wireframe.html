<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Login</title><style>
* { margin:0; padding:0; box-sizing:border-box; font-family: monospace, sans-serif; }
body { display:flex; height:100vh; }
.left { width:50%; background:#f5f5f5; }
.right { width:50%; background:#555; display:flex; align-items:center; justify-content:center; }
.form-box { background:#fff; padding:30px; width:320px; border:2px solid #000; }
.title { text-align:center; font-weight:bold; font-size:16px; margin-bottom:20px; border-bottom:2px solid #000; padding-bottom:10px; }
.label { background:#eee; border:1px solid #000; padding:8px 10px; margin-bottom:8px; font-size:12px; font-weight:bold; }
.input-box { border:1px solid #000; padding:10px; margin-bottom:15px; background:#fff; height:40px; }
.btn { background:#333; color:#fff; border:1px solid #000; padding:12px; text-align:center; font-weight:bold; font-size:13px; cursor:pointer; }
.btn:hover { background:#555; }
</style></head>
<body>
<div class="left"></div>
<div class="right">
  <div class="form-box">
    <div class="title">LOGIN ARSIP SURAT</div>
    <div class="label">USERNAME</div>
    <div class="input-box"></div>
    <div class="label">PASSWORD</div>
    <div class="input-box"></div>
    <div class="btn">MASUK</div>
  </div>
</div>
</body></html>
