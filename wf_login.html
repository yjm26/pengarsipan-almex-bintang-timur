<!DOCTYPE html>
<html>
<head><title>Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#fff; }
.box { border:1px solid #000; padding:32px; width:320px; }
.box h2 { text-align:center; margin-bottom:20px; font-size:18px; }
.box input { width:100%; padding:8px; border:1px solid #000; margin-bottom:12px; font-size:13px; }
.box button { width:100%; padding:10px; background:#000; color:#fff; border:none; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
<input type="text" placeholder="Username" />
<input type="password" placeholder="Password" />
<button>Login</button>
</div>
</body>
</html>
