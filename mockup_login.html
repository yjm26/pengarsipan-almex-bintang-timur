<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arsip ABT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0A0A0A', zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' } } } } }
    </script>
    <style>
        body { background-color: #000; }
        .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(63, 63, 70, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-md rounded-2xl p-8 shadow-2xl">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-white rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-white/10">
                <span class="text-zinc-950 font-bold text-xl tracking-widest">ABT</span>
            </div>
            <h1 class="text-2xl font-semibold text-white tracking-tight">Masuk ke Arsip</h1>
            <p class="text-zinc-500 text-sm mt-1">PT. Almex Bintang Timur</p>
        </div>

        <!-- Form -->
        <form class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5 ml-1">Username</label>
                <input type="text" value="admin" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all placeholder-zinc-600">
            </div>
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5 ml-1">Password</label>
                <input type="password" value="password" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all placeholder-zinc-600">
            </div>
            <button class="w-full bg-white text-zinc-950 font-medium py-3 rounded-lg hover:bg-zinc-200 transition-colors mt-2 shadow-lg shadow-white/5">
                Masuk
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <span class="text-xs text-zinc-600">© 2025 PT. Almex Bintang Timur</span>
        </div>
    </div>
</body>
</html>
