<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Arsip ABT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0A0A0A', zinc: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' } } } } }
    </script>
</head>
<body class="bg-zinc-950 text-white h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#0A0A0A] flex-shrink-0 flex flex-col border-r border-zinc-800/50">
        <div class="flex items-center px-6 py-5 border-b border-zinc-800/50">
            <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center flex-shrink-0">
                <span class="text-zinc-950 font-bold text-[10px] tracking-widest">ABT</span>
            </div>
            <span class="font-semibold tracking-tight text-lg text-white ml-3">Arsip</span>
        </div>
        <div class="px-5 py-4">
            <div class="flex items-center gap-2 px-3 py-2.5 bg-zinc-900/60 rounded-lg border border-zinc-800 text-zinc-500 text-xs">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span>Cari menu...</span>
            </div>
        </div>
        <nav class="flex-1 px-3 py-2 space-y-1">
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-zinc-800 text-white text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </div>
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-500 hover:bg-zinc-900/50 hover:text-zinc-300 text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Upload Dokumen
            </div>
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-500 hover:bg-zinc-900/50 hover:text-zinc-300 text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Arsip Surat
            </div>
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-500 hover:bg-zinc-900/50 hover:text-zinc-300 text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Kategori
            </div>
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-500 hover:bg-zinc-900/50 hover:text-zinc-300 text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Pengaturan
            </div>
        </nav>
        <div class="p-4 border-t border-zinc-800/50">
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-500 hover:bg-red-500/10 hover:text-red-400 text-sm font-medium cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="h-16 bg-zinc-950/80 backdrop-blur border-b border-zinc-800/50 flex items-center justify-between px-6">
            <h2 class="text-lg font-medium">Dashboard</h2>
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold">A</div>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6">
            <!-- KPI Cards -->
            <div class="grid grid-cols-4 gap-4 mb-6">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500 mb-1">Total Dokumen</p>
                    <p class="text-2xl font-bold text-white">1,245</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500 mb-1">Surat Masuk</p>
                    <p class="text-2xl font-bold text-emerald-400">890</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500 mb-1">Surat Keluar</p>
                    <p class="text-2xl font-bold text-blue-400">355</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500 mb-1">Perlu Verifikasi</p>
                    <p class="text-2xl font-bold text-amber-400">12</p>
                </div>
            </div>

            <!-- Chart Placeholder -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 h-48 flex items-center justify-center">
                    <span class="text-zinc-600 text-sm">[ Grafik Aktivitas Dokumen ]</span>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 h-48 flex items-center justify-center">
                    <span class="text-zinc-600 text-sm">[ Distribusi Kategori ]</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
