<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Wireframe</title>
<style>
body { margin:0; display:flex; height:100vh; font-family: sans-serif; background:#fff; }
.left-panel { width:50%; background:#0A0A0A; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
.logo-box { width:64px; height:64px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px; letter-spacing:3px; color:#000; margin-bottom:24px; }
.brand-title { font-size:24px; font-weight:600; letter-spacing:1px; }
.brand-sub { color:#71717a; margin-top:8px; font-size:14px; }
.right-panel { width:50%; display:flex; align-items:center; justify-content:center; padding:40px; }
.form-box { width:100%; max-width:320px; }
.form-title { font-size:28px; font-weight:600; color:#18181b; margin-bottom:12px; }
.form-sub { color:#71717a; margin-bottom:32px; font-size:14px; line-height:1.5; }
.input-group { margin-bottom:20px; }
.input-label { display:block; font-size:13px; font-weight:500; color:#3f3f46; margin-bottom:6px; }
.input-box { width:100%; padding:12px; border:1px solid #d4d4d8; border-radius:8px; font-size:14px; box-sizing:border-box; background:#fafafa; }
.forgot { text-align:right; font-size:13px; color:#D49A28; margin-bottom:20px; font-weight:500; }
.btn-login { width:100%; padding:12px; background:#0A0A0A; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; }
.footer { margin-top:40px; text-align:center; font-size:12px; color:#a1a1aa; }
</style></head><body>
<div class="left-panel"><div class="logo-box">ABT</div><div class="brand-title">Arsip Surat</div><div class="brand-sub">PT. Almex Bintang Timur</div></div>
<div class="right-panel"><div class="form-box">
<div class="form-title">Selamat Datang</div>
<div class="form-sub">Masuk untuk mengakses sistem arsip PT. Almex Bintang Timur.</div>
<div class="input-group"><div class="input-label">Username</div><div class="input-box"></div></div>
<div class="input-group"><div class="input-label">Password</div><div class="input-box"></div></div>
<div class="forgot">Lupa password?</div>
<div class="btn-login">Masuk</div>
<div class="footer">&copy; 2025 PT. Almex Bintang Timur</div>
</div></div></body></html>
